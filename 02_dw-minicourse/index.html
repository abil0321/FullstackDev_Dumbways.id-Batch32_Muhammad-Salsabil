<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Profil dan Kontak Sandhika Galih</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sisi Kiri -->
      <section class="profile">
        <!-- Contoh avatar SVG sederhana -->
        <img src="img/user.png" alt="user.png" srcset="" class="image-user" />

        <h1>Sandhika Galih</h1>
        <p>Lecturer | Developer | Content Creator</p>

        <!-- Ikon sosial: Twitter, GitHub, Dribbble, CodePen, LinkedIn -->
        <div class="socials">
          <a
            href="#"
            aria-label="Twitter"
            title="Twitter"
            style="display: inline-block"
          >
            x
          </a>
          <a
            href="#"
            aria-label="GitHub"
            title="GitHub"
            style="display: inline-block"
          >
            gh
          </a>
          <a
            href="#"
            aria-label="Dribbble"
            title="Dribbble"
            style="display: inline-block"
          >
            db
          </a>
          <a
            href="#"
            aria-label="CodePen"
            title="CodePen"
            style="display: inline-block"
          >
            cp
          </a>
          <a
            href="#"
            aria-label="LinkedIn"
            title="LinkedIn"
            style="display: inline-block"
          >
            link
          </a>
        </div>

        <ul class="links">
          <a href="#">
            <li>
              <span>
                <img src="img/lensa.png" alt="" srcset="" />
                My Website
              </span>
              →
            </li>
          </a>
          <a href="#">
            <li>
              <span>
                <img src="img/matahari.png" alt="" srcset="" />
                Visual Ideas
              </span>
              →
            </li>
          </a>
          <a href="#">
            <li>
              <span>
                <img src="img/gt.png" alt="" srcset="" />
                Newsletter
              </span>
              →
            </li>
          </a>
          <a href="#">
            <li>
              <span>
                <img src="img/lensa.png" alt="" srcset="" />
                Shop
              </span>
              →
            </li>
          </a>
          <a href="#">
            <li>
              <span>
                <img src="img/user.png" alt="" srcset="" />
                What I'm Doing Now
              </span>
              →
            </li>
          </a>
        </ul>
      </section>

      <!-- Sisi Kanan -->
      <section class="contact-form">
        <h2>Contact Me!</h2>

        <form action="#" method="post" aria-label="Form kontak">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Jhon Smith"
            required
          />

          <label for="email">Your email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email@gmail.com"
            required
          />

          <label for="message">Your message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder=""
            required
          ></textarea>

          <button type="submit">Send message</button>
        </form>
      </section>
    </div>

    <footer>
      <small>Made with <span>❤️</span> by Sandhika Galih</small>
    </footer>
  </body>
</html>
