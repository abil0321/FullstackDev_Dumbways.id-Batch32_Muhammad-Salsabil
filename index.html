<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Card with Bootstrap 5</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        background: #e9ecef;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .nav-link:hover,
      .nav-link.active {
        font-weight: 700;
      }
      .btn-custom-primary {
        background-color: #121a2c;
        color: #fff;
        border-radius: 50px;
        padding-left: 1.9rem;
        padding-right: 1.9rem;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        text-transform: lowercase;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      .btn-custom-primary:hover,
      .btn-custom-primary:focus {
        background-color: #0d1321;
        color: #fff;
      }
      .card-profile {
        border-radius: 0.5rem;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.06), 0 20px 40px rgb(0 0 0 / 0.1);
      }
      .card-profile img {
        border-radius: 0.5rem 0.5rem 0 0;
        max-height: 350px;
        object-fit: cover;
      }
      .profile-footer {
        background: #faf9f9;
        padding: 1rem 1.25rem;
        border-radius: 0 0 0.5rem 0.5rem;
      }
      .profile-footer h5 {
        font-weight: 700;
        margin-bottom: 0;
      }
      .profile-footer small {
        color: #777;
        font-weight: 400;
        font-style: normal;
      }
      .social-icons a {
        color: #121a2c;
        font-size: 1.25rem;
        margin-right: 1rem;
        transition: color 0.3s ease;
      }
      .social-icons a:hover,
      .social-icons a:focus {
        color: #0d1321;
        text-decoration: none;
      }
      .download-cv {
        cursor: pointer;
        font-weight: 500;
        color: #121a2c;
        margin-left: 1rem;
        display: inline-flex;
        align-items: center;
        user-select: none;
        transition: color 0.3s ease;
      }
      .download-cv svg {
        margin-left: 0.25rem;
        height: 20px;
        width: 20px;
        vertical-align: middle;
        fill: currentColor;
      }
      .download-cv:hover {
        color: #0d1321;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="logo_dumbwaysid.png"
            alt="Logo"
            width="64"
            height="44"
            class="d-inline-block align-text-top me-3"
          />
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav align-items-center gap-lg-3">
            <li class="nav-item">
              <a class="nav-link active fw-bold" aria-current="page" href="#"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">My Project</a>
            </li>
          </ul>

          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item">
              <a class="btn btn-custom-primary" href="#">Contact Me</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container py-5 my-5">
      <div class="row rounded-3 shadow card-profile p-5">
        <div class="col-md-12">
          <h2 class="text-center fw-bold">Get In Touch</h2>
          <form>
            <div class="mb-3">
              <label for="nameInput" class="form-label fw-semibold">Name</label>
              <input
                type="text"
                class="form-control shadow"
                id="nameInput"
                placeholder="Your full name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="emailInput" class="form-label fw-semibold">Email</label>
              <input
                type="email"
                class="form-control shadow"
                id="emailInput"
                placeholder="name@example.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="phoneInput" class="form-label fw-semibold">Phone Number</label>
              <input
                type="tel"
                class="form-control shadow"
                id="phoneInput"
                placeholder="+62 8123456789"
              />
            </div>
            <div class="mb-3">
              <label for="subjectSelect" class="form-label fw-semibold">Subject</label>
              <select class="form-select shadow" id="subjectSelect" required>
                <option value="" selected disabled>Choose a subject</option>
                <option value="general">General Inquiry</option>
                <option value="project">Project Collaboration</option>
                <option value="support">Support</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="messageTextarea" class="form-label fw-semibold"
                >Your Message</label
              >
              <textarea
                class="form-control shadow"
                id="messageTextarea"
                rows="4"
                placeholder="Write your message here..."
                required
              ></textarea>
            </div>
            <button
              type="submit"
              class="btn btn-custom-primary d-block ms-auto text-lowercase fw-semibold"
            >
              submit
            </button>
          </form>
        </div>
      </div>

      <div class="p-4 p-lg-5"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
