<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Project - Profile Card with Bootstrap 5</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/styles/edit.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="assets/images/logo_dumbwaysid.png"
            alt="Logo"
            width="64"
            height="44"
            class="d-inline-block align-text-top me-3"
          />
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav align-items-center gap-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active fw-bold" aria-current="page" href="index.html">My Project</a>
            </li>
          </ul>

          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item">
              <a class="btn btn-custom-primary" href="#">Contact Me</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container py-5 my-5">
      <div class="row rounded-3 shadow card-profile p-5">
        <div class="col-md-12">
          <!-- Edit Project Form -->
          <section class="mb-5">
            <h3 class="text-center fw-bold mb-4" style="letter-spacing: 0.06em">
              EDIT MY PROJECT
            </h3>
            
            <!-- Loading indicator -->
            <div id="loadingIndicator" class="text-center mb-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2">Loading project data...</p>
            </div>
            
            <!-- Error message -->
            <div id="errorMessage" class="alert alert-danger d-none" role="alert">
              <i class="fas fa-exclamation-circle"></i>
              <span id="errorText"></span>
            </div>
            
            <!-- Success message -->
            <div id="successMessage" class="alert alert-success d-none" role="alert">
              <i class="fas fa-check-circle"></i>
              Project updated successfully!
            </div>

            <form id="editForm" style="display: none;">
              <div class="mb-3">
                <label for="projectName" class="form-label fw-semibold">Project Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="projectName"
                  placeholder="Enter project name"
                  required
                />
              </div>

              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="startDate" class="form-label fw-semibold">Start Date</label>
                  <input type="date" class="form-control" id="startDate" required />
                </div>
                <div class="col-md-6">
                  <label for="endDate" class="form-label fw-semibold">End Date</label>
                  <input type="date" class="form-control" id="endDate" required />
                </div>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea
                  class="form-control"
                  id="description"
                  rows="3"
                  placeholder="Enter project description"
                  required
                ></textarea>
              </div>

              <fieldset class="mb-3 row">
                <legend class="col-form-label fw-semibold mb-2">Technologies</legend>
                <div class="col-md-4 col-sm-6 d-grid gap-3">
                  <div class="form-check form-check-inline d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="nodejs"
                      value="Node Js"
                    />
                    <label class="form-check-label" for="nodejs">Node Js</label>
                  </div>
                  <div class="form-check form-check-inline d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="nextjs"
                      value="Next Js"
                    />
                    <label class="form-check-label" for="nextjs">Next Js</label>
                  </div>
                </div>

                <div class="col-md-4 col-sm-6 d-grid gap-3">
                  <div class="form-check form-check-inline d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="reactjs"
                      value="React Js"
                    />
                    <label class="form-check-label" for="reactjs">React Js</label>
                  </div>
                  <div class="form-check form-check-inline d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="typescript"
                      value="TypeScript"
                    />
                    <label class="form-check-label" for="typescript">TypeScript</label>
                  </div>
                </div>
              </fieldset>

              <!-- Current Image Display -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Current Image</label>
                <div id="currentImageContainer">
                  <img id="currentImage" class="current-image" alt="Current project image" />
                </div>
              </div>

              <div class="mb-4">
                <label for="uploadImage" class="form-label fw-semibold">Upload New Image (Optional)</label>
                <input class="form-control" type="file" id="uploadImage" accept="image/*" />
                <div class="form-text">Leave empty to keep the current image</div>
              </div>

              <div class="text-end">
                <button type="button" class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                <button id="submitBtn" type="submit">Update Project</button>
              </div>
            </form>
          </section>
        </div>
      </div>

      <div class="p-4 p-lg-5"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/scripts/edit.js"></script>
  </body>
</html>
