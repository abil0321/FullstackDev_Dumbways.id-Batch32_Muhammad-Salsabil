<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <style>
    body {
      font-family: "Space Grotesk", sans-serif;
    }

    /* Profile */
    .container {
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .main-container {
      box-shadow: 3px 3px black;
    }
    .image-user {
      width: 20%;
    }

    .links {
      list-style: none;
    }

    .links a {
      text-decoration: none;
    }

    .links li {
      border: 1px solid black;
      margin: 5px;
      color: black;
      font-size: 0.8em;
      border-radius: 25px;
      -webkit-border-radius: 25px;
      -moz-border-radius: 25px;
      -ms-border-radius: 25px;
      -o-border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 10px;
    }
    .links img {
      width: 50px;
    }
    .links li:hover {
      box-shadow: 3px 3px black;
      transform: translateX(-5px);
    }

    /* Contact Form */
    .contact-form {
      margin: 50px auto;
      padding: 10px;
    }

    .contact-form h2 {
      text-align: center;
      margin: 20px 0;
    }

    .contact-form label {
      font-weight: 500;
      font-size: 0.8em;
    }
    .contact-form input {
      display: block;
      width: 100%;
      font-size: 0.7em;
      color: #666;
      padding: 5px;
      margin: 10px auto 25px;
      border: 0px;
      border-bottom: 2px solid black;
    }
    .contact-form textarea {
      display: block;
      width: 100%;
      margin: 10px auto 25px;
      font-size: 0.8em;
      color: #666;
      padding: 5px;
      border: 0px;
      border-bottom: 2px solid black;
    }
    .contact-form button {
      width: 100%;
      font-size: 0.8em;
      padding: 8px;
      background-color: black;
      color: white;
      border-radius: 20px;
      -webkit-border-radius: 20px;
      -moz-border-radius: 20px;
      -ms-border-radius: 20px;
      -o-border-radius: 20px;
      border: 1px solid black;
      cursor: pointer;
    }
    .contact-form button:hover {
      background-color: white;
      color: black;
    }
  </style>
  <body>
    <div class="container">
      <div class="main-container row border border-2 border-dark rounded-4 p-3">
        <div class="col-md-6">
          <section class="profile text-center">
            <!-- Contoh avatar SVG sederhana -->
            <img
              src="img/user.png"
              alt="user.png"
              srcset=""
              class="image-user"
            />

            <h1>Sandhika Galih</h1>
            <p class="fs-6">Lecturer | Developer | Content Creator</p>

            <!-- Ikon sosial: Twitter, GitHub, Dribbble, CodePen, LinkedIn -->
            <div class="socials d-flex justify-content-center gap-3 mb-3">
              <a
                href="#"
                aria-label="Twitter"
                title="Twitter"
                class="text-dark"
              >
                <i class="bi bi-twitter-x"></i>
              </a>
              <a href="#" aria-label="GitHub" title="GitHub" class="text-dark">
                <i class="bi bi-github"></i>
              </a>
              <a
                href="#"
                aria-label="Dribbble"
                title="Dribbble"
                class="text-dark"
              >
                <i class="bi bi-dribbble"></i>
              </a>
              <a
                href="#"
                aria-label="CodePen"
                title="CodePen"
                class="text-dark"
              >
                <i class="bi bi-pen"></i>
              </a>
              <a
                href="#"
                aria-label="LinkedIn"
                title="LinkedIn"
                class="text-dark"
              >
                <i class="bi bi-linkedin"></i>
              </a>
            </div>

            <ul class="links">
              <a href="#">
                <li>
                  <span>
                    <img src="img/lensa.png" alt="" srcset="" />
                    My Website
                  </span>
                  <i class="bi bi-arrow-right"></i>
                </li>
              </a>
              <a href="#">
                <li>
                  <span>
                    <img src="img/matahari.png" alt="" srcset="" />
                    Visual Ideas
                  </span>
                  <i class="bi bi-arrow-right"></i>
                </li>
              </a>
              <a href="#">
                <li>
                  <span>
                    <img src="img/gt.png" alt="" srcset="" />
                    Newsletter
                  </span>
                  <i class="bi bi-arrow-right"></i>
                </li>
              </a>
              <a href="#">
                <li>
                  <span>
                    <img src="img/lensa.png" alt="" srcset="" />
                    Shop
                  </span>
                  <i class="bi bi-arrow-right"></i>
                </li>
              </a>
              <a href="#">
                <li>
                  <span>
                    <img src="img/user.png" alt="" srcset="" />
                    What I'm Doing Now
                  </span>
                  <i class="bi bi-arrow-right"></i>
                </li>
              </a>
            </ul>
          </section>
        </div>
        <div class="col-md-6">
          <section class="contact-form">
            <h2>Contact Me!</h2>

            <form action="#" method="post" aria-label="Form kontak">
              <label for="name">Your name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Jhon Smith"
                required
              />

              <label for="email">Your email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@gmail.com"
                required
              />

              <label for="message">Your message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder=""
                required
              ></textarea>

              <button type="submit">Send message</button>
            </form>
          </section>
        </div>
        <footer class="text-center">
          <small>Made with <span>❤️</span> by Sandhika Galih</small>
        </footer>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
